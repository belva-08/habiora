{% load static %}
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Réinitialiser le mot de passe</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <style>
        /* Styles supplémentaires spécifiques à cette page */
        .reset-box {
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            animation: slideUp 0.5s ease-out;
            max-width: 450px;
            width: 100%;
        }

        .instructions {
            color: #666;
            font-size: 14px;
            text-align: center;
            margin-bottom: 25px;
            line-height: 1.6;
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 500;
            font-size: 14px;
        }

        .input-group input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: all 0.3s ease;
            background: #f8f9fa;
        }

        .input-group input:focus {
            outline: none;
            border-color: #667eea;
            background: white;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .btn-secondary {
            display: block;
            text-align: center;
            padding: 12px;
            color: #667eea;
            text-decoration: none;
            font-weight: 500;
            border-radius: 8px;
            transition: background 0.3s;
        }

        .btn-secondary:hover {
            background: #f0f2ff;
        }

        .back-link {
            margin-top: 15px;
            display: block;
            text-align: center;
            color: #999;
            text-decoration: none;
            font-size: 14px;
        }

        .back-link:hover {
            color: #667eea;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="reset-box">
            <h2>🔑 Réinitialiser le mot de passe</h2>
            
            <p class="instructions">
                Entrez votre adresse email et nous vous enverrons un lien pour réinitialiser votre mot de passe.
            </p>

            <div id="message" class="message hidden"></div>

            <form id="resetForm" method="post">
                {% csrf_token %}
                <div class="input-group">
                    <label for="email">Adresse email</label>
                    <input type="email" id="email" name="email" placeholder="exemple@email.com" required>
                </div>

                <button type="submit" class="btn-primary">Envoyer le lien de réinitialisation</button>
                
                <a href="{% url 'accounts:login' %}" class="back-link">← Retour à la connexion</a>
            </form>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const form = document.getElementById('resetForm');
            const emailInput = document.getElementById('email');
            const messageDiv = document.getElementById('message');

            function showMessage(text, type) {
                messageDiv.textContent = text;
                messageDiv.className = 'message ' + type;
                messageDiv.classList.remove('hidden');
                
                clearTimeout(window.messageTimeout);
                window.messageTimeout = setTimeout(() => {
                    messageDiv.classList.add('hidden');
                }, 6000);
            }

            form.addEventListener('submit', function(e) {
                e.preventDefault();
                
                const email = emailInput.value.trim();
                
                if (!email) {
                    showMessage('Veuillez entrer votre adresse email.', 'error');
                    return;
                }

                if (!email.match(/^[^\s@]+@[^\s@]+\.[^\s@]+$/)) {
                    showMessage('Veuillez entrer une adresse email valide.', 'error');
                    return;
                }

                // Désactiver le bouton
                const submitBtn = form.querySelector('.btn-primary');
                submitBtn.disabled = true;
                submitBtn.textContent = 'Envoi en cours...';

                const formData = new FormData(form);
                formData.append('email', email);

                fetch('{% url "accounts:password_reset" %}', {
                    method: 'POST',
                    headers: {
                        'X-CSRFToken': document.querySelector('[name=csrfmiddlewaretoken]').value,
                        'X-Requested-With': 'XMLHttpRequest'
                    },
                    body: formData
                })
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        showMessage(data.message, 'success');
                        emailInput.value = '';
                    } else {
                        showMessage(data.message, 'error');
                    }
                })
                .catch(error => {
                    showMessage('Erreur de connexion au serveur.', 'error');
                    console.error('Erreur:', error);
                })
                .finally(() => {
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Envoyer le lien de réinitialisation';
                });
            });
        });
    </script>
</body>
</html>
