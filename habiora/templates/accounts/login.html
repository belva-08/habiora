
{% load static %}

<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion - Habiora</title>
    <link rel="stylesheet" href="{% static 'css/login.css' %}">
</head>

<body>

<div class="page">

    <div class="login-card">

        <div class="welcome">
            <h2>Bienvenue</h2>
            <p>Accédez à votre espace sécurisé</p>
        </div>

        {% if messages %}
            {% for message in messages %}
                <div class="message {% if message.tags == 'error' %}message-error{% elif message.tags == 'success' %}message-success{% endif %}">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}

        <form method="POST">
            {% csrf_token %}

            <div class="form-group">
                <label for="username"> Email</label>
                <div class="input-box">
                    <span class="icon" aria-hidden="true">
                        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M20 21a8 8 0 0 0-16 0"></path>
                            <circle cx="12" cy="7" r="4"></circle>
                        </svg>
                    </span>
                    <input
                        type="email"
                        id="username"
                        name="username"
                        placeholder="Entrez votre email"
                        value="{{ username|default:'' }}"
                        required
                        autofocus
                    >
                </div>
            </div>

            <div class="password-header">
                <label for="password">Mot de passe</label>
                <a href="{% url 'accounts:password_reset' %}">Mot de passe oublié ?</a>
            </div>

            <div class="input-box">
                <span class="icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="5" y="11" width="14" height="10" rx="2"></rect>
                        <path d="M8 11V8a4 4 0 1 1 8 0v3"></path>
                    </svg>
                </span>
                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Entrez votre mot de passe"
                    required
                >
                <button type="button" class="show-password" onclick="togglePassword()" aria-label="Afficher le mot de passe">
                    <svg class="eye-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"></path>
                        <circle cx="12" cy="12" r="3"></circle>
                    </svg>
                </button>
            </div>

            <button type="submit" class="login-button">
                Connexion
            </button>
        </form>

        <div class="register">
            <p>Pas encore de compte ?</p>
            <a href="{% url 'accounts:register' %}">S'inscrire</a>
        </div>

    </div>

</div>

<script>
function togglePassword() {
    const password = document.getElementById("password");
    const btn = document.querySelector(".show-password");
    const icon = btn.querySelector("svg");

    const isPassword = password.type === "password";

    password.type = isPassword ? "text" : "password";

    if (isPassword) {
        icon.innerHTML = `
            <path d="M3 3l18 18"></path>
            <path d="M10.58 10.58A2 2 0 0 0 13.42 13.42"></path>
            <path d="M9.88 5.08A10.94 10.94 0 0 1 12 5c6.5 0 10 7 10 7a16.4 16.4 0 0 1-4.58 5.67"></path>
            <path d="M6.61 6.61A16.9 16.9 0 0 0 2 12s3.5 7 10 7a11.4 11.4 0 0 0 5.39-1.61"></path>
        `;
    } else {
        icon.innerHTML = `
            <path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"></path>
            <circle cx="12" cy="12" r="3"></circle>
        `;
    }
}

document.addEventListener('DOMContentLoaded', function() {
    const form = document.querySelector('form');
    const inputs = form.querySelectorAll('input');
    
    inputs.forEach(input => {
        input.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                form.submit();
            }
        });
    });
});
</script>

</body>
</html>
