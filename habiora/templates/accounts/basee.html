{% load static %}
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>{% block title %}Mon compte{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'accounts/css/accounts.css' %}">
</head>
<body>
  <header class="account-header">
    <a href="{% url 'accounts:profile' %}">Mon compte</a>
    {% if user.is_authenticated %}
      <a href="{% url 'accounts:sessions' %}">Sessions</a>
      <a href="{% url 'accounts:preferences' %}">Préférences</a>
      <a href="{% url 'accounts:logout' %}">Déconnexion</a>
    {% else %}
      <a href="{% url 'accounts:login' %}">Connexion</a>
      <a href="{% url 'accounts:register' %}">Inscription</a>
    {% endif %}
  </header>

  {% if messages %}
    <div class="messages">
      {% for m in messages %}
        <div class="alert alert-{{ m.tags }}">{{ m }}</div>
      {% endfor %}
    </div>
  {% endif %}

  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
