<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Changer le mot de passe</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <div class="password-box">
            <h2>🔒 Changer le mot de passe</h2>

            {% if errors %}
                <div class="message">{% for error in errors %}<p>{{ error }}</p>{% endfor %}</div>
            {% endif %}
            
            <!-- Affichage des messages -->
            <div id="message" class="message hidden"></div>

            <form id="passwordForm" method="post">
                {% csrf_token %}
                <div class="form-group">
                    <label for="currentPassword">Mot de passe actuel</label>
                    <div class="password-input-wrapper">
                        <input type="password" id="currentPassword" name="current_password"
                               placeholder="Entrez votre mot de passe actuel" required>
                        <span class="toggle-password" onclick="togglePassword('currentPassword')">👁️</span>
                    </div>
                </div>

                <div class="form-group">
                    <label for="newPassword">Nouveau mot de passe</label>
                    <div class="password-input-wrapper">
                        <input type="password" id="newPassword" name="new_password"
                               placeholder="Entrez votre nouveau mot de passe" required>
                        <span class="toggle-password" onclick="togglePassword('newPassword')">👁️</span>
                    </div>
                    <div class="password-strength" id="passwordStrength"></div>
                </div>

                <div class="form-group">
                    <label for="confirmPassword">Confirmer le nouveau mot de passe</label>
                    <div class="password-input-wrapper">
                        <input type="password" id="confirmPassword" name="confirmation"
                               placeholder="Confirmez votre nouveau mot de passe" required>
                        <span class="toggle-password" onclick="togglePassword('confirmPassword')">👁️</span>
                    </div>
                </div>

                <button type="submit" class="btn-primary">Changer le mot de passe</button>
                <a href="{% url 'accounts:profile' %}" class="btn-secondary">← Retour au profil</a>
            </form>
        </div>
    </div>

    <script src="js/script.js"></script>
</body>
</html>
