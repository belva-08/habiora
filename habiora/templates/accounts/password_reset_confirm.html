<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confirmation de réinitialisation</title>
    <link rel="stylesheet" href="account/css/style.css">
    <style>
        /* Styles spécifiques à la page de confirmation */
        .confirm-box {
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            animation: slideUp 0.5s ease-out;
            max-width: 500px;
            width: 100%;
        }

        .status-icon {
            text-align: center;
            font-size: 64px;
            margin-bottom: 20px;
        }

        .status-icon.success {
            color: #28a745;
        }

        .status-icon.error {
            color: #dc3545;
        }

        .status-icon.pending {
            color: #ffc107;
        }

        .status-title {
            text-align: center;
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 15px;
            color: #333;
        }

        .status-message {
            text-align: center;
            color: #666;
            font-size: 16px;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        .details-box {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 25px;
            border-left: 4px solid #667eea;
        }

        .details-box .label {
            font-weight: 600;
            color: #555;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .details-box .value {
            color: #333;
            font-size: 15px;
            margin-top: 5px;
            word-break: break-all;
        }

        .button-group {
            display: flex;
            gap: 10px;
            flex-direction: column;
        }

        .btn-success {
            width: 100%;
            padding: 14px;
            background: #28a745;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-success:hover {
            background: #218838;
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(40, 167, 69, 0.3);
        }

        .btn-danger {
            width: 100%;
            padding: 14px;
            background: #dc3545;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-danger:hover {
            background: #c82333;
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(220, 53, 69, 0.3);
        }

        .btn-secondary {
            display: block;
            text-align: center;
            padding: 12px;
            color: #667eea;
            text-decoration: none;
            font-weight: 500;
            border-radius: 8px;
            transition: background 0.3s;
        }

        .btn-secondary:hover {
            background: #f0f2ff;
        }

        .token-display {
            background: #e9ecef;
            padding: 10px;
            border-radius: 5px;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            color: #495057;
            word-break: break-all;
            margin-top: 10px;
        }

        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 1s ease-in-out infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .resend-link {
            text-align: center;
            margin-top: 15px;
            font-size: 14px;
        }

        .resend-link a {
            color: #667eea;
            text-decoration: none;
            font-weight: 500;
        }

        .resend-link a:hover {
            text-decoration: underline;
        }

        /* Animation d'entrée */
        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Loading overlay */
        .loading-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.5);
            z-index: 999;
            justify-content: center;
            align-items: center;
        }

        .loading-overlay.active {
            display: flex;
        }

        .loading-box {
            background: white;
            padding: 30px;
            border-radius: 15px;
            text-align: center;
        }

        .loading-box .spinner-large {
            width: 50px;
            height: 50px;
            border: 5px solid #f3f3f3;
            border-top: 5px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }
    </style>
</head>
<body>
    <!-- Loading Overlay -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-box">
            <div class="spinner-large"></div>
            <p style="color: #333; font-weight: 500;">Traitement en cours...</p>
        </div>
    </div>

    <div class="container">
        <div class="confirm-box">
            <!-- Statut : success, error, pending -->
            <div id="statusDisplay">
                <div class="status-icon pending" id="statusIcon">⏳</div>
                <h2 class="status-title" id="statusTitle">Vérification en cours...</h2>
                <p class="status-message" id="statusMessage">
                    Nous vérifions votre demande de réinitialisation.
                </p>
            </div>

            <!-- Détails du token (si succès) -->
            <div id="detailsBox" class="details-box" style="display: none;">
                <div class="label">📋 Détails de la demande</div>
                <div class="value" id="detailsContent">
                    <strong>Utilisateur :</strong> <span id="userName">-</span><br>
                    <strong>Email :</strong> <span id="userEmail">-</span><br>
                    <strong>Date :</strong> <span id="resetDate">-</span>
                </div>
            </div>

            <!-- Boutons d'action -->
            <div id="actionButtons" style="display: none;">
                <div class="button-group">
                    <button class="btn-success" id="confirmBtn" onclick="confirmReset()">
                        ✅ Confirmer la réinitialisation
                    </button>
                    <button class="btn-danger" id="cancelBtn" onclick="cancelReset()">
                        ❌ Annuler
                    </button>
                    <a href="login.html" class="btn-secondary">← Retour à la connexion</a>
                </div>
            </div>

            <!-- Message d'erreur -->
            <div id="errorActions" style="display: none;">
                <div class="button-group">
                    <a href="password_reset.html" class="btn-primary">
                        🔄 Faire une nouvelle demande
                    </a>
                    <a href="login.html" class="btn-secondary">← Retour à la connexion</a>
                </div>
            </div>

            <!-- Token affiché pour debug (optionnel) -->
            <div id="tokenDebug" style="display: none; margin-top: 20px;">
                <div class="token-display">
                    <strong>Token :</strong> <span id="tokenValue"></span>
                </div>
            </div>

            <!-- Lien pour renvoyer (si erreur) -->
            <div class="resend-link">
                <a href="password_reset.html">Besoin d'aide ? Contactez le support</a>
            </div>
        </div>
    </div>

    <script>
        // Récupérer le token depuis l'URL
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');
        const userId = urlParams.get('user_id') || '';
        const email = urlParams.get('email') || '';

        // Éléments DOM
        const statusIcon = document.getElementById('statusIcon');
        const statusTitle = document.getElementById('statusTitle');
        const statusMessage = document.getElementById('statusMessage');
        const detailsBox = document.getElementById('detailsBox');
        const actionButtons = document.getElementById('actionButtons');
        const errorActions = document.getElementById('errorActions');
        const loadingOverlay = document.getElementById('loadingOverlay');

        // Vérification initiale
        document.addEventListener('DOMContentLoaded', function() {
            if (!token) {
                showError('❌ Token manquant', 'Aucun token de réinitialisation trouvé dans l\'URL.');
                return;
            }

            // Afficher le token en debug (optionnel)
            if (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') {
                document.getElementById('tokenDebug').style.display = 'block';
                document.getElementById('tokenValue').textContent = token;
            }

            // Vérifier le token
            verifyToken(token);
        });

        function verifyToken(token) {
            showLoading();

            const formData = new FormData();
            formData.append('token', token);
            formData.append('action', 'verify');

            fetch('password_reset_confirm.php', {
                method: 'POST',
                body: formData
            })
            .then(response => response.json())
            .then(data => {
                hideLoading();

                if (data.success) {
                    showSuccess(data);
                } else {
                    showError('❌ Token invalide', data.message);
                }
            })
            .catch(error => {
                hideLoading();
                showError('❌ Erreur de connexion', 'Impossible de contacter le serveur. Veuillez réessayer.');
                console.error('Erreur:', error);
            });
        }

        function showSuccess(data) {
            statusIcon.className = 'status-icon success';
            statusIcon.textContent = '✅';
            statusTitle.textContent = 'Token valide !';
            statusMessage.textContent = 'Vous pouvez confirmer la réinitialisation de votre mot de passe.';

            // Afficher les détails
            detailsBox.style.display = 'block';
            document.getElementById('userName').textContent = data.user_name || 'Utilisateur';
            document.getElementById('userEmail').textContent = data.email || 'Email non disponible';
            document.getElementById('resetDate').textContent = data.date || new Date().toLocaleString();

            // Afficher les boutons d'action
            actionButtons.style.display = 'block';
            
            // Stocker les données pour la confirmation
            window.resetData = {
                token: token,
                userId: data.user_id,
                tokenId: data.token_id
            };
        }

        function showError(title, message) {
            statusIcon.className = 'status-icon error';
            statusIcon.textContent = '❌';
            statusTitle.textContent = title;
            statusMessage.textContent = message;

            // Afficher les actions d'erreur
            errorActions.style.display = 'block';
        }

        function confirmReset() {
            if (!window.resetData) {
                showError('❌ Erreur', 'Données manquantes pour la confirmation.');
                return;
            }

            if (!confirm('Êtes-vous sûr de vouloir réinitialiser votre mot de passe ?')) {
                return;
            }

            showLoading();

            const formData = new FormData();
            formData.append('token', window.resetData.token);
            formData.append('user_id', window.resetData.userId);
            formData.append('token_id', window.resetData.tokenId);
            formData.append('action', 'confirm');

            fetch('password_reset_confirm.php', {
                method: 'POST',
                body: formData
            })
            .then(response => response.json())
            .then(data => {
                hideLoading();

                if (data.success) {
                    // Succès - rediriger vers la page de création de mot de passe
                    window.location.href = `reset_password.php?token=${window.resetData.token}&confirmed=true`;
                } else {
                    showError('❌ Échec de la confirmation', data.message);
                }
            })
            .catch(error => {
                hideLoading();
                showError('❌ Erreur de connexion', 'Impossible de confirmer la réinitialisation.');
                console.error('Erreur:', error);
            });
        }

        function cancelReset() {
            if (confirm('Voulez-vous vraiment annuler cette demande de réinitialisation ?')) {
                window.location.href = 'login.html';
            }
        }

        function showLoading() {
            loadingOverlay.classList.add('active');
        }

        function hideLoading() {
            loadingOverlay.classList.remove('active');
        }

        // Gestion du token dans l'URL automatique
        // Si le token est présent, la page se charge automatiquement
    </script>
</body>
</html>
